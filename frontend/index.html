<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkOps - Enterprise Staff Management Login</title>
    
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5.3 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- FontAwesome 6 Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 10% 20%, rgba(79, 70, 229, 0.15) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.12) 0%, transparent 40%),
                        var(--bg-primary);
            padding: 24px;
        }

        .login-card {
            width: 100%;
            max-width: 460px;
            padding: 40px;
            border-radius: var(--radius-xl);
            background: var(--bg-glass-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
        }

        .quick-role-pill {
            cursor: pointer;
            font-size: 0.775rem;
            padding: 6px 12px;
            border-radius: 999px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            transition: var(--transition-fast);
        }

        .quick-role-pill:hover {
            border-color: var(--primary);
            color: var(--text-primary);
            background: var(--bg-glass-hover);
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">
        <!-- Brand Header -->
        <div class="text-center mb-4">
            <div class="brand-icon mx-auto mb-3" style="width: 52px; height: 52px; font-size: 1.5rem;">
                <i class="fa-solid fa-layer-group"></i>
            </div>
            <h3 class="fw-bold mb-1">Work<span class="text-gradient-primary">Ops</span></h3>
            <p class="small text-muted">Enterprise Staff Management & Geofencing System</p>
        </div>

        <!-- Login Form -->
        <form id="login-form">
            <div class="mb-3">
                <label class="form-label" for="username">Username or Email</label>
                <div class="input-group">
                    <span class="input-group-text bg-secondary border-secondary text-muted">
                        <i class="fa-regular fa-user"></i>
                    </span>
                    <input type="text" class="form-control" id="username" placeholder="john.doe or admin@workops.io" required value="john.doe">
                </div>
            </div>

            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label class="form-label mb-0" for="password">Password</label>
                    <a href="#" class="small text-decoration-none text-info" style="font-size: 0.8rem;">Forgot?</a>
                </div>
                <div class="input-group">
                    <span class="input-group-text bg-secondary border-secondary text-muted">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" class="form-control" id="password" placeholder="••••••••••••" required value="Password@123">
                </div>
            </div>

            <div class="d-flex align-items-center justify-content-between mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="remember-me" checked>
                    <label class="form-check-label small text-secondary" for="remember-me">Remember session</label>
                </div>
                <span class="badge bg-success-subtle text-success border border-success-subtle small">
                    <i class="fa-solid fa-shield-halved me-1"></i> JWT 256-bit
                </span>
            </div>

            <button type="submit" class="btn btn-workops-primary w-100 py-2 fs-6 mb-4" id="btn-submit-login">
                <i class="fa-solid fa-right-to-bracket me-2"></i> Sign In to WorkOps
            </button>
        </form>

        <!-- Demo Quick Logins -->
        <div class="border-top border-secondary pt-3">
            <div class="small text-muted text-center mb-2" style="font-size: 0.775rem;">QUICK TEST ROLES (CLICK TO AUTOFILL)</div>
            <div class="d-flex flex-wrap gap-2 justify-content-center">
                <span class="quick-role-pill" data-user="john.doe" data-role="ROLE_STAFF" data-name="John Doe" data-desig="Senior Full Stack Engineer">
                    <i class="fa-solid fa-code me-1 text-primary"></i> Staff (Engineer)
                </span>
                <span class="quick-role-pill" data-user="admin" data-role="ROLE_ADMIN" data-name="System Administrator" data-desig="Chief Technology Officer">
                    <i class="fa-solid fa-user-shield me-1 text-danger"></i> Admin
                </span>
                <span class="quick-role-pill" data-user="sarah.hr" data-role="ROLE_HR" data-name="Sarah Connor" data-desig="Head of Human Resources">
                    <i class="fa-solid fa-user-tie me-1 text-warning"></i> HR Manager
                </span>
            </div>
        </div>

    </div>
</div>

<!-- Bootstrap 5.3 JS CDN -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
    import { ApiClient } from './assets/js/api.js';
    import { WorkOps } from './assets/js/main.js';

    // Quick Autofill Click Handler
    document.querySelectorAll('.quick-role-pill').forEach(pill => {
        pill.addEventListener('click', () => {
            const user = pill.getAttribute('data-user');
            document.getElementById('username').value = user;
            document.getElementById('password').value = 'Password@123';
            WorkOps.showToast('info', `Autofilled credentials for ${pill.getAttribute('data-name')}`);
        });
    });

    // Handle Login Form Submit
    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const submitBtn = document.getElementById('btn-submit-login');

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin me-2"></i> Authenticating...';

        try {
            // Attempt Backend Authentication
            const res = await ApiClient.post('/auth/login', { username, password });
            
            let userObj = {
                username: username,
                fullName: username === 'admin' ? 'System Administrator' : (username === 'sarah.hr' ? 'Sarah Connor' : 'John Doe'),
                designation: username === 'admin' ? 'Chief Technology Officer' : (username === 'sarah.hr' ? 'Head of HR' : 'Senior Full Stack Engineer'),
                departmentName: username === 'sarah.hr' ? 'Human Resources' : 'Engineering & Technology',
                role: username === 'admin' ? 'ROLE_ADMIN' : (username === 'sarah.hr' ? 'ROLE_HR' : 'ROLE_STAFF')
            };

            if (res && res.success && res.data) {
                ApiClient.setToken(res.data.token || 'mock_jwt_token_sample');
                userObj = {
                    username: res.data.username || userObj.username,
                    fullName: res.data.fullName || userObj.fullName,
                    designation: res.data.designation || userObj.designation,
                    departmentName: res.data.departmentName || userObj.departmentName,
                    role: res.data.role || userObj.role
                };
            }

            localStorage.setItem('workops_user', JSON.stringify(userObj));
            WorkOps.showToast('success', `Welcome back, ${userObj.fullName}! Redirecting...`, 'Authentication Approved');

            setTimeout(() => {
                window.location.href = 'pages/attendance.html';
            }, 800);

        } catch (error) {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket me-2"></i> Sign In to WorkOps';
            WorkOps.showToast('error', error.message || 'Login failed. Please check credentials.');
        }
    });
</script>
</body>
</html>
