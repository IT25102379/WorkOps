<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Staff Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top right, #312e81 0%, transparent 40%),
                        radial-gradient(circle at bottom left, #831843 0%, transparent 40%);
            background-color: #0f172a;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
            text-align: center;
        }
        .login-title {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            margin-bottom: 2rem;
        }
        .form-control {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 0.8rem;
        }
        .form-control:focus {
            background: rgba(30, 41, 59, 0.9);
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 0 0 0.25rem rgba(99, 102, 241, 0.25);
        }
        .btn-login {
            width: 100%;
            padding: 0.8rem;
            margin-top: 1rem;
        }
    </style>
</head>
<body>

<div class="card login-card">
    <h2 class="login-title"><i class="bi bi-shield-lock"></i> Staff Portal</h2>
    
    <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
        <span th:text="${errorMessage}"></span>
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-4 text-start">
            <label for="email" class="form-label text-muted">Email Address</label>
            <div class="input-group">
                <span class="input-group-text bg-transparent border-end-0 border-secondary"><i class="bi bi-envelope text-muted"></i></span>
                <input type="email" class="form-control border-start-0" id="email" name="email" required placeholder="e.g. john.employee@example.com">
            </div>
            <div class="form-text text-muted mt-2">
                <small>Hint: Try <b>john.employee@example.com</b> (Employee) or <b>alice.hr@example.com</b> (HR)</small>
            </div>
        </div>
        
        <button type="submit" class="btn btn-primary btn-login">Sign In</button>
    </form>
</div>

</body>
</html>
