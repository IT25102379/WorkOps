spring.application.name=StaffManagementSystem

# MS SQL Server Database Configuration
# spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=StaffManagementDB;encrypt=true;trustServerCertificate=true
# spring.datasource.username=sa
# spring.datasource.password=${DB_PASSWORD:StrongPassword123!}
# spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate / JPA configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# Option to use H2 for local dev if SQL server isn't running
spring.datasource.url=jdbc:h2:mem:staffdb;NON_KEYWORDS=YEAR
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

server.port=8080

spring.thymeleaf.cache=false
