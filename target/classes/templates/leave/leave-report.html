<!DOCTYPE html>
<html th:replace="~{layout/base :: html(content=~{::div.content-wrapper})}">
<body>
<div class="content-wrapper">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Leave Reports</h2>
        <button class="btn btn-primary" onclick="window.print()"><i class="bi bi-printer me-2"></i>Print Report</button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped table-hover mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Employee Name</th>
                            <th>Leave Type</th>
                            <th>Start Date</th>
                            <th>End Date</th>
                            <th>Days</th>
                            <th>Status</th>
                            <th>Approver</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="req : ${allRequests}">
                            <td th:text="'#' + ${req.leaveRequestId}"></td>
                            <td th:text="${req.employee.fullName}"></td>
                            <td th:text="${req.leaveType.leaveTypeName}"></td>
                            <td th:text="${#temporals.format(req.startDate, 'yyyy-MM-dd')}"></td>
                            <td th:text="${#temporals.format(req.endDate, 'yyyy-MM-dd')}"></td>
                            <td th:text="${req.numberOfDays}"></td>
                            <td>
                                <span class="badge" 
                                      th:classappend="${req.status.name() == 'APPROVED' ? 'bg-success' : (req.status.name() == 'PENDING' ? 'bg-warning text-dark' : (req.status.name() == 'REJECTED' ? 'bg-danger' : 'bg-secondary'))}"
                                      th:text="${req.status}"></span>
                            </td>
                            <td th:text="${req.approvedBy != null ? req.approvedBy.fullName : '-'}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(allRequests)}">
                            <td colspan="8" class="text-center py-4">No data available for report.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
