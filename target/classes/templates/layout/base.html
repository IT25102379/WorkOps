<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Management System - Leave Module</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="d-flex h-100" id="wrapper">
    <!-- Sidebar -->
    <div class="bg-dark text-white" id="sidebar-wrapper">
        <div class="sidebar-heading p-3 border-bottom text-center">
            <h5>Staff Management</h5>
        </div>
        <div class="list-group list-group-flush">
            <a href="#" class="list-group-item list-group-item-action bg-dark text-white"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
            <a href="#" class="list-group-item list-group-item-action bg-dark text-white"><i class="bi bi-people me-2"></i>Employees</a>
            <a href="#" class="list-group-item list-group-item-action bg-dark text-white"><i class="bi bi-calendar-check me-2"></i>Attendance</a>
            <a th:href="@{/leave/dashboard}" class="list-group-item list-group-item-action bg-primary text-white"><i class="bi bi-calendar2-minus me-2"></i>Leave Management</a>
            <a href="#" class="list-group-item list-group-item-action bg-dark text-white"><i class="bi bi-cash me-2"></i>Payroll</a>
            <a href="#" class="list-group-item list-group-item-action bg-dark text-white"><i class="bi bi-graph-up me-2"></i>Performance</a>
            <a href="#" class="list-group-item list-group-item-action bg-dark text-white"><i class="bi bi-book me-2"></i>Staff Development</a>
            <a href="#" class="list-group-item list-group-item-action bg-dark text-white mt-5 border-top"><i class="bi bi-box-arrow-right me-2"></i>Logout</a>
        </div>
    </div>

    <!-- Page Content -->
    <div id="page-content-wrapper" class="flex-grow-1 bg-light">
        <!-- Top Navbar -->
        <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm">
            <div class="container-fluid">
                <button class="btn btn-primary" id="menu-toggle"><i class="bi bi-list"></i></button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav ms-auto mt-2 mt-lg-0">
                        <li class="nav-item">
                            <form class="d-flex me-3">
                                <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                            </form>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-primary" href="#"><i class="bi bi-bell-fill fs-5"></i></a>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle d-flex align-items-center" id="navbarDropdown" href="#" role="button" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                                <div class="ms-2 text-end d-none d-md-block">
                                    <span class="d-block fw-bold" style="line-height: 1;">John Doe</span>
                                    <small class="text-muted">EMPLOYEE / IT</small>
                                </div>
                            </a>
                            <div class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
                                <a class="dropdown-item" href="#">Profile</a>
                                <a class="dropdown-item" href="#">Settings</a>
                                <div class="dropdown-divider"></div>
                                <a class="dropdown-item" href="#">Logout</a>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="container-fluid p-4">
            
            <!-- Flash Messages -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            
            <div th:replace="${content}"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById("menu-toggle").addEventListener("click", function (e) {
        e.preventDefault();
        document.getElementById("wrapper").classList.toggle("toggled");
    });
</script>
<script th:src="@{/js/leave.js}"></script>
<th:block th:if="${extraScripts}">
    <div th:replace="${extraScripts}"></div>
</th:block>
</body>
</html>
